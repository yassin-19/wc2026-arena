<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>كأس العالم 2026 - البطولة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --gold:#f5c518;--gold2:#e8a900;
  --bg:#070d18;--bg2:#0d1525;--bg3:#111e33;
  --surface:rgba(255,255,255,0.04);
  --surface2:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --text:rgba(255,255,255,0.92);
  --dim:rgba(255,255,255,0.45);
  --dim2:rgba(255,255,255,0.2);
  --win:#00e676;--lose:#ff1744;--draw:#ff9100;
  --radius:12px;
}
html,body{
  min-height:100%;background:var(--bg);
  font-family:'Tajawal',sans-serif;color:var(--text);
}

/* ── HEADER ── */
#header{
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:16px 20px 14px;
  text-align:center;
  position:sticky;top:0;z-index:100;
}
.header-trophy{font-size:28px;}
.header-title{
  font-family:'Cairo',sans-serif;font-size:22px;font-weight:900;
  color:var(--gold);margin-top:2px;
}
.header-sub{font-size:12px;color:var(--dim);margin-top:2px;}
#last-updated{font-size:11px;color:var(--dim2);margin-top:4px;}

/* ── TABS ── */
#tabs{
  display:flex;background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 16px;gap:4px;
  overflow-x:auto;
}
.tab{
  padding:10px 16px;font-size:13px;font-weight:700;
  color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;
  transition:all 0.15s;white-space:nowrap;
  font-family:'Cairo',sans-serif;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab:hover{color:var(--text);}

/* ── MAIN CONTENT ── */
#content{padding:16px;}

/* ── GROUPS TAB ── */
#groups-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:14px;
}
.group-block{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.group-block-header{
  padding:10px 14px;
  background:rgba(245,197,24,0.06);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.group-block-title{
  font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;color:var(--gold);
}
.group-block-body{padding:10px 14px;}

/* Standings mini */
.mini-standings{width:100%;border-collapse:collapse;margin-bottom:10px;}
.mini-standings th{
  font-size:10px;color:var(--dim2);padding:3px 6px;
  text-align:center;border-bottom:1px solid var(--border);font-weight:700;
}
.mini-standings th:first-child{text-align:right;}
.mini-standings td{
  padding:5px 6px;font-size:12px;text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.04);
}
.mini-standings td:first-child{text-align:right;}
.mini-standings tr.promoted td{background:rgba(0,230,118,0.05);}
.mini-standings tr.promoted td:first-child{border-right:2px solid var(--win);}
.mini-team-cell{display:flex;align-items:center;gap:5px;}
.mini-flag{width:20px;height:14px;border-radius:2px;object-fit:cover;}
.mini-pts{font-family:'Cairo',sans-serif;font-weight:900;color:var(--gold);font-size:13px;}
.mini-pos{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:900;
  background:var(--surface2);color:var(--dim2);margin-left:3px;
}
.mini-pos.p1,.mini-pos.p2{background:rgba(0,230,118,0.15);color:var(--win);}

/* Mini matches */
.mini-matches{display:flex;flex-direction:column;gap:5px;}
.mini-match{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);border-radius:8px;padding:6px 10px;font-size:12px;
}
.mini-match.played{background:rgba(0,230,118,0.04);}
.mini-team-name{flex:1;}
.mini-team-name.winner{color:var(--win);font-weight:700;}
.mini-team-name.away-name{text-align:left;flex-direction:row-reverse;}
.mini-team-name.loser{color:var(--dim2);}
.mini-score{
  font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;
  color:var(--gold);padding:0 8px;min-width:40px;text-align:center;
}
.mini-score.pending{color:var(--dim2);font-size:11px;}

/* ── BRACKET TAB ── */
#bracket-wrap{overflow-x:auto;padding-bottom:16px;}
.bracket-stage{margin-bottom:28px;}
.stage-title{
  font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;
  color:var(--gold);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.stage-title::before{content:'';flex:1;height:1px;background:var(--border);}
.bracket-matches{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px;
}
.bracket-card{
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
}
.bracket-card.played{border-color:rgba(0,230,118,0.2);}
.bracket-card.tbd{opacity:0.5;}
.bracket-match-id{font-size:10px;color:var(--dim2);margin-bottom:8px;letter-spacing:0.5px;}
.bracket-team{
  display:flex;align-items:center;gap:8px;
  padding:5px 0;border-bottom:1px solid var(--border);
}
.bracket-team:last-child{border-bottom:none;padding-bottom:0;}
.bracket-flag{width:28px;height:20px;border-radius:3px;object-fit:cover;}
.bracket-name{flex:1;font-size:13px;font-weight:700;}
.bracket-name.winner{color:var(--win);}
.bracket-name.loser{color:var(--dim2);}
.bracket-name.tbd{color:var(--dim2);font-style:italic;}
.bracket-score{
  font-family:'Cairo',sans-serif;font-size:16px;font-weight:900;color:var(--gold);
}

/* ── LIVE BADGE ── */
.live-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(255,71,87,0.15);border:1px solid rgba(255,71,87,0.3);
  border-radius:20px;padding:3px 8px;font-size:10px;color:#ff4757;
  font-weight:700;letter-spacing:0.5px;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:#ff4757;
  animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* ── REFRESH ── */
#refresh-btn{
  position:fixed;bottom:20px;left:20px;
  background:var(--gold);color:#000;border:none;
  border-radius:50px;padding:10px 18px;
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:900;
  cursor:pointer;box-shadow:0 4px 16px rgba(245,197,24,0.3);
  transition:transform 0.15s,box-shadow 0.15s;z-index:50;
}
#refresh-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,197,24,0.4);}
#refresh-btn:active{transform:scale(0.96);}
#refresh-btn.spinning{animation:spin 0.8s linear;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}]

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>

<div id="header">
  <div class="header-trophy">🏆</div>
  <div class="header-title">أرينا كأس العالم 2026</div>
  <div class="header-sub">متابعة المباريات والترتيب — 48 منتخب</div>
  <div id="last-updated">جاري التحميل...</div>
</div>

<div id="tabs">
  <div class="tab active" onclick="switchTab('groups')">المجموعات</div>
  <div class="tab" onclick="switchTab('bracket')">جدول التأهل</div>
</div>

<div id="content">
  <div id="tab-groups"></div>
  <div id="tab-bracket" style="display:none;"></div>
</div>

<button id="refresh-btn" onclick="loadAndRender()">↻ تحديث</button>

<script>
const GITHUB_OWNER = 'YOUR_GITHUB_USERNAME';
const GITHUB_REPO  = 'wc2026-arena';
const GITHUB_FILE  = 'tournament.json';

const GROUP_ARABIC = {A:'أ',B:'ب',C:'ج',D:'د',E:'هـ',F:'و',G:'ز',H:'ح',I:'ط',J:'ي',K:'ك',L:'ل'};
const GROUPS_DATA  = {
  A:['MEX','ZAF','KOR','CZE'],B:['CAN','BIH','QAT','SUI'],
  C:['BRA','MAR','HAI','SCO'],D:['USA','PRY','AUS','TUR'],
  E:['GER','CUW','CIV','ECU'],F:['NED','JPN','SWE','TUN'],
  G:['BEL','EGY','IRN','NZL'],H:['ESP','CPV','SAU','URU'],
  I:['FRA','SEN','IRQ','NOR'],J:['ARG','ALG','AUT','JOR'],
  K:['POR','COD','UZB','COL'],L:['ENG','CRO','GHA','PAN']
};
const TEAMS_DATA = {
  ESP:{name:'إسبانيا',balls:8},ARG:{name:'الأرجنتين',balls:8},
  FRA:{name:'فرنسا',balls:8},ENG:{name:'إنجلترا',balls:8},
  BRA:{name:'البرازيل',balls:8},POR:{name:'البرتغال',balls:8},
  NED:{name:'هولندا',balls:8},BEL:{name:'بلجيكا',balls:8},
  SUI:{name:'سويسرا',balls:7},GER:{name:'ألمانيا',balls:7},
  CRO:{name:'كرواتيا',balls:7},URU:{name:'أوروغواي',balls:7},
  MAR:{name:'المغرب',balls:7},USA:{name:'الولايات المتحدة',balls:7},
  MEX:{name:'المكسيك',balls:7},JPN:{name:'اليابان',balls:7},
  COL:{name:'كولومبيا',balls:6},SEN:{name:'السنغال',balls:6},
  AUT:{name:'النمسا',balls:6},AUS:{name:'أستراليا',balls:6},
  KOR:{name:'كوريا الجنوبية',balls:6},CAN:{name:'كندا',balls:6},
  NOR:{name:'النرويج',balls:6},SWE:{name:'السويد',balls:6},
  ALG:{name:'الجزائر',balls:6},IRN:{name:'إيران',balls:6},
  ECU:{name:'الإكوادور',balls:6},CIV:{name:'كوت ديفوار',balls:6},
  TUR:{name:'تركيا',balls:5},CPV:{name:'الرأس الأخضر',balls:5},
  QAT:{name:'قطر',balls:5},ZAF:{name:'جنوب أفريقيا',balls:5},
  TUN:{name:'تونس',balls:5},PRY:{name:'باراغواي',balls:5},
  SCO:{name:'اسكتلندا',balls:5},CZE:{name:'التشيك',balls:5},
  BIH:{name:'البوسنة والهرسك',balls:5},COD:{name:'الكونغو الديمقراطية',balls:5},
  NZL:{name:'نيوزيلندا',balls:5},SAU:{name:'السعودية',balls:5},
  HAI:{name:'هايتي',balls:4},JOR:{name:'الأردن',balls:4},
  UZB:{name:'أوزبكستان',balls:4},CUW:{name:'كوراساو',balls:4},
  IRQ:{name:'العراق',balls:4},GHA:{name:'غانا',balls:4},
  EGY:{name:'مصر',balls:4},PAN:{name:'بنما',balls:4}
};
const FLAG_EXCEPTIONS = {ENG:'gb-eng',SCO:'gb-sct'};
function flagUrl(code){ return `https://flagcdn.com/w40/${(FLAG_EXCEPTIONS[code]||code).toLowerCase()}.png`; }
function flagImg(code,cls){ return `<img class="${cls}" src="${flagUrl(code)}" alt="${code}" onerror="this.style.opacity='0.2'">`; }

let tournament = null;
let activeTab  = 'groups';

// ── LOAD DATA ──
async function loadAndRender(){
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  try{
    const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,{
      headers:{'Accept':'application/vnd.github.v3+json'}
    });
    const data = await r.json();
    tournament = JSON.parse(atob(data.content.replace(/\n/g,'')));
    const d = new Date();
    document.getElementById('last-updated').textContent =
      `آخر تحديث: ${d.toLocaleTimeString('ar-MA')}`;
  } catch(e){
    console.error('Load failed',e);
    document.getElementById('last-updated').textContent = 'تعذر التحميل';
  }
  btn.classList.remove('spinning');
  renderAll();
}

function renderAll(){
  renderGroupsTab();
  renderBracketTab();
}

// ── STANDINGS ──
function getGroupResults(g){
  if(!tournament) return [];
  return (tournament.results||[]).filter(r=>r.group===g);
}

function getStandings(g){
  const teams = GROUPS_DATA[g];
  const results = getGroupResults(g);
  const st = {};
  teams.forEach(t=>{ st[t]={played:0,won:0,drawn:0,lost:0,pts:0}; });
  results.forEach(r=>{
    if(!r.completed) return;
    const h=r.home,a=r.away;
    st[h].played++; st[a].played++;
    if(r.score_home>r.score_away){
      st[h].won++; st[h].pts+=3; st[a].lost++;
    } else if(r.score_away>r.score_home){
      st[a].won++; st[a].pts+=3; st[h].lost++;
    } else {
      st[h].drawn++; st[h].pts+=1; st[a].drawn++; st[a].pts+=1;
    }
  });
  return Object.entries(st).map(([code,s])=>({code,...s}))
    .sort((a,b)=>b.pts-a.pts||(Math.random()-0.5));
}

function generateMatchList(g){
  const teams=GROUPS_DATA[g], matches=[];
  for(let i=0;i<teams.length;i++)
    for(let j=i+1;j<teams.length;j++)
      matches.push({home:teams[i],away:teams[j],group:g});
  return matches;
}

// ── GROUPS TAB ──
function renderGroupsTab(){
  const cont = document.getElementById('tab-groups');
  let html = '<div id="groups-grid">';
  Object.entries(GROUPS_DATA).forEach(([g,teams])=>{
    const standings = getStandings(g);
    const matches   = generateMatchList(g);
    const results   = getGroupResults(g);
    const played    = results.filter(r=>r.completed).length;

    html+=`<div class="group-block">
      <div class="group-block-header">
        <div class="group-block-title">المجموعة ${GROUP_ARABIC[g]}</div>
        ${played>0?`<span class="live-badge"><span class="live-dot"></span>${played}/${matches.length} مباريات</span>`:''}
      </div>
      <div class="group-block-body">
        <table class="mini-standings">
          <thead><tr>
            <th>المنتخب</th><th>ل</th><th>ف</th><th>ت</th><th>خ</th><th>ن</th>
          </tr></thead><tbody>`;

    standings.forEach((s,i)=>{
      const promoted = i<2?'promoted':'';
      html+=`<tr class="${promoted}">
        <td><div class="mini-team-cell">
          <span class="mini-pos ${i<2?'p'+(i+1):''}">${i+1}</span>
          ${flagImg(s.code,'mini-flag')}
          <span>${TEAMS_DATA[s.code]?.name||s.code}</span>
        </div></td>
        <td>${s.played}</td><td>${s.won}</td><td>${s.drawn}</td><td>${s.lost}</td>
        <td class="mini-pts">${s.pts}</td>
      </tr>`;
    });

    html+=`</tbody></table><div class="mini-matches">`;

    matches.forEach((m,i)=>{
      const played=results.find(r=>(r.home===m.home&&r.away===m.away)||(r.home===m.away&&r.away===m.home));
      let homeClass='',awayClass='',scoreHtml='',cardClass='';
      if(played&&played.completed){
        cardClass='played';
        const hIsHome=played.home===m.home;
        const hs=hIsHome?played.score_home:played.score_away;
        const as=hIsHome?played.score_away:played.score_home;
        const hWon=hs>as, draw=hs===as;
        homeClass=draw?'':(hWon?'winner':'loser');
        awayClass=draw?'':(hWon?'loser':'winner');
        scoreHtml=`<div class="mini-score">${hs} - ${as}</div>`;
      } else {
        scoreHtml=`<div class="mini-score pending">vs</div>`;
      }
      html+=`<div class="mini-match ${cardClass}">
        <div class="mini-team-cell" style="flex:1">
          ${flagImg(m.home,'mini-flag')}
          <span class="mini-team-name ${homeClass}">${TEAMS_DATA[m.home]?.name||m.home}</span>
        </div>
        ${scoreHtml}
        <div class="mini-team-cell" style="flex:1;justify-content:flex-end;flex-direction:row-reverse">
          ${flagImg(m.away,'mini-flag')}
          <span class="mini-team-name away-name ${awayClass}">${TEAMS_DATA[m.away]?.name||m.away}</span>
        </div>
      </div>`;
    });

    html+=`</div></div></div>`;
  });
  html+='</div>';
  cont.innerHTML=html;
}

// ── BRACKET TAB ──
function renderBracketTab(){
  const cont = document.getElementById('tab-bracket');
  const ko   = tournament?.knockout||{};

  // Calculate qualifiers from groups
  const qualifiers = {};
  Object.keys(GROUPS_DATA).forEach(g=>{
    const st=getStandings(g);
    qualifiers[g]={ first:st[0]?.code||'؟', second:st[1]?.code||'؟', third:st[2]?.code||'؟' };
  });

  function matchCard(id, homeCode, awayCode, result){
    const homeName = homeCode&&homeCode!=='؟'?TEAMS_DATA[homeCode]?.name||homeCode:'في الانتظار';
    const awayName = awayCode&&awayCode!=='؟'?TEAMS_DATA[awayCode]?.name||awayCode:'في الانتظار';
    const tbd      = !homeCode||!awayCode||homeCode==='؟'||awayCode==='؟';
    const played   = result&&result.completed;
    const hWon     = played&&result.score_home>result.score_away;
    const aWon     = played&&result.score_away>result.score_home;
    return `<div class="bracket-card ${played?'played':''} ${tbd?'tbd':''}">
      <div class="bracket-match-id">${id}</div>
      <div class="bracket-team">
        ${homeCode&&homeCode!=='؟'?`<img class="bracket-flag" src="${flagUrl(homeCode)}" alt="" onerror="this.style.opacity='0.2'">`:
          '<div style="width:28px;height:20px;background:var(--surface2);border-radius:3px;"></div>'}
        <span class="bracket-name ${played?(hWon?'winner':'loser'):(tbd?'tbd':'')}">${homeName}</span>
        ${played?`<span class="bracket-score">${result.score_home}</span>`:''}
      </div>
      <div class="bracket-team">
        ${awayCode&&awayCode!=='؟'?`<img class="bracket-flag" src="${flagUrl(awayCode)}" alt="" onerror="this.style.opacity='0.2'">`:
          '<div style="width:28px;height:20px;background:var(--surface2);border-radius:3px;"></div>'}
        <span class="bracket-name ${played?(aWon?'winner':'loser'):(tbd?'tbd':'')}">${awayName}</span>
        ${played?`<span class="bracket-score">${result.score_away}</span>`:''}
      </div>
    </div>`;
  }

  // R32 matchups (top 2 per group + 8 best thirds)
  const r32Matchups=[
    {id:'م1',h:qualifiers.A?.first,  a:qualifiers.B?.second},
    {id:'م2',h:qualifiers.C?.first,  a:qualifiers.D?.second},
    {id:'م3',h:qualifiers.E?.first,  a:qualifiers.F?.second},
    {id:'م4',h:qualifiers.G?.first,  a:qualifiers.H?.second},
    {id:'م5',h:qualifiers.I?.first,  a:qualifiers.J?.second},
    {id:'م6',h:qualifiers.K?.first,  a:qualifiers.L?.second},
    {id:'م7',h:qualifiers.A?.second, a:qualifiers.B?.first},
    {id:'م8',h:qualifiers.C?.second, a:qualifiers.D?.first},
    {id:'م9',h:qualifiers.E?.second, a:qualifiers.F?.first},
    {id:'م10',h:qualifiers.G?.second,a:qualifiers.H?.first},
    {id:'م11',h:qualifiers.I?.second,a:qualifiers.J?.first},
    {id:'م12',h:qualifiers.K?.second,a:qualifiers.L?.first},
    {id:'م13',h:'؟',a:'؟'},{id:'م14',h:'؟',a:'؟'},
    {id:'م15',h:'؟',a:'؟'},{id:'م16',h:'؟',a:'؟'},
  ];

  const stages=[
    {key:'r32', label:'دور الـ 32', matches:r32Matchups},
    {key:'r16', label:'دور الـ 16', matches:Array.from({length:8},(_,i)=>({id:`م${i+1}`,h:'؟',a:'؟'}))},
    {key:'qf',  label:'ربع النهائي', matches:Array.from({length:4},(_,i)=>({id:`م${i+1}`,h:'؟',a:'؟'}))},
    {key:'sf',  label:'نصف النهائي', matches:Array.from({length:2},(_,i)=>({id:`م${i+1}`,h:'؟',a:'؟'}))},
    {key:'final',label:'النهائي',    matches:[{id:'النهائي الكبير',h:'؟',a:'؟'}]},
  ];

  let html='<div id="bracket-wrap">';
  stages.forEach(stage=>{
    const stageResults = ko[stage.key]||[];
    html+=`<div class="bracket-stage">
      <div class="stage-title">${stage.label}</div>
      <div class="bracket-matches">`;
    stage.matches.forEach((m,i)=>{
      const res=stageResults[i]||null;
      const home=res?.home||m.h;
      const away=res?.away||m.a;
      html+=matchCard(m.id, home, away, res);
    });
    html+=`</div></div>`;
  });
  html+='</div>';
  cont.innerHTML=html;
}

// ── TABS ──
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',['groups','bracket'][i]===tab);
  });
  document.getElementById('tab-groups').style.display  = tab==='groups' ?'block':'none';
  document.getElementById('tab-bracket').style.display = tab==='bracket'?'block':'none';
}
